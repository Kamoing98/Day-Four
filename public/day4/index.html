<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Note Draft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Note Draft</h1>
    <label for="note-text">Write your note:</label>
    <textarea id="note-text" placeholder="Start typing your note here..."></textarea>
    <p id="char-count">0 / 200 characters</p>
    <p id="word-count">0 words</p>
    <div class="button-group">
      <button id="clear-btn">Clear</button>
      <button id="theme-toggle">Dark mode</button>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
